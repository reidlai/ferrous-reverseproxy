[package]
name = "ferrous-reverseproxy"
version = "0.1.0"
edition = "2024"
authors = ["FerrousCX Platform Team"]
description = "Edge Reverse Proxy, TLS Termination & OWASP WAF Stack for FerrousCX Platform"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1.2"
bytes = "1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1.10"
rustls-pemfile = "2.2"
rcgen = "0.13"
zentinel-modsec = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
notify = "7.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
