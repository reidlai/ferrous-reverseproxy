# ------------------------------------------------------------------------
# FerrousCX Day-0 Ad-Hoc Mitigations & LLM Prompt Injection Filters
# ------------------------------------------------------------------------

# FerrousCX Prompt Injection Defense (LLM Gateway Guard)
SecRule ARGS|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(ignore\s+previous\s+instructions|system\s+prompt\s+override|disregard\s+all\s+prior\s+rules|you\s+are\s+now\s+in\s+developer\s+mode|jailbreak|DAN\s+mode)" \
    "id:949100,phase:2,t:urlDecodeUni,t:lowercase,deny,status:403,log,msg:'[FERROUS-LLM] Prompt Injection Attack Blocked'"

# Mitigate Day-0 Remote Code Execution (RCE) / JNDI Exploit (CVE-2021-44228)
SecRule ARGS|REQUEST_HEADERS|REQUEST_URI|REQUEST_BODY "@rx (?i)\$\{jndi:(?:ldap|rmi|dns|nis|iiop):" \
    "id:9990001,phase:2,t:urlDecodeUni,t:lowercase,deny,status:403,log,msg:'[FERROUS-DAY0] JNDI Injection Exploit Blocked'"
