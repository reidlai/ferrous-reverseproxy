# ------------------------------------------------------------------------
# OWASP Core Rule Set (CRS) v4 - Cross-Site Scripting (XSS) Filters
# ------------------------------------------------------------------------
SecRule ARGS|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(<script[^>]*>|javascript:|onerror\s*=|onload\s*=|alert\(|<iframe|<svg[^>]*onload)" \
    "id:941100,phase:2,t:urlDecodeUni,t:lowercase,t:htmlEntityDecode,deny,status:403,log,msg:'OWASP CRS: Cross-Site Scripting (XSS) Attack Detected'"
