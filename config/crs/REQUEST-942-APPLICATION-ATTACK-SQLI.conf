# ------------------------------------------------------------------------
# OWASP Core Rule Set (CRS) v4 - SQL Injection (SQLi) Filters
# ------------------------------------------------------------------------
SecRule ARGS|REQUEST_HEADERS|REQUEST_BODY "@rx (?i)(union\s+select|select\s+.*\s+from|insert\s+into|delete\s+from|drop\s+table|--\s+|--$|\b1=1\b|'\s*or\s*'1'='1|benchmark\(|sleep\()" \
    "id:942100,phase:2,t:urlDecodeUni,t:lowercase,deny,status:403,log,msg:'OWASP CRS: SQL Injection Attack Detected'"
